name: Configure staging dev booking connection
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/staging-integration-setup.yml]
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify and configure dev connection without exposing credentials
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          INTEGRATION_ID: ${{ secrets.STAGING_SHARETRIBE_INTEGRATION_CLIENT_ID }}
          INTEGRATION_SECRET: ${{ secrets.STAGING_SHARETRIBE_INTEGRATION_CLIENT_SECRET }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          SCRIPT_B64=''
          node -e 'process.stdout.write(JSON.stringify({clientId:process.env.INTEGRATION_ID,clientSecret:process.env.INTEGRATION_SECRET}))' | \
            ssh -i ~/.ssh/staging.key -p "$SSH_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "/home/sharetribe/.nvm/versions/node/v14.15.4/bin/node -e 'eval(Buffer.from(\"$SCRIPT_B64\",\"base64\").toString(\"utf8\"))'"
