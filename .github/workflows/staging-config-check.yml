name: Read staging integration configuration
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/staging-config-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configuration presence without exposing values
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'awk -f - /home/sharetribe/web/staging.hotpatch.com/current/.env' <<'AWK'
          /^[[:space:]]*#/ { next }
          {
              equal = index($0, "=")
              if (!equal) next
              key = substr($0, 1, equal - 1)
              sub(/^[[:space:]]*(export[[:space:]]+)?/, "", key)
              sub(/[[:space:]]+$/, "", key)
              if (key !~ /^[A-Za-z_][A-Za-z0-9_]*$/) next
              upper = toupper(key)
              relevant = upper ~ /INTEGRATION/ || (upper ~ /FLEX|SHARETRIBE/ && upper ~ /CLIENT|SECRET|KEY/)
              if (!relevant) next
              value = substr($0, equal + 1)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              gsub(/^["\047]|["\047]$/, "", value)
              status = length(value) && tolower(value) !~ /^(change-me|your-client-id|your-client-secret)$/ ? "configured" : "empty/placeholder"
              print key ": " status
              if (upper ~ /INTEGRATION/) found = 1
          }
          END { print "Integration-named settings present: " (found ? "yes" : "no") }
          AWK
