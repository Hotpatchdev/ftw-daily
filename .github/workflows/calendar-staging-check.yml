name: Check staging calendar prerequisites
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/calendar-staging-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read staging configuration presence only
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" /home/sharetribe/.nvm/versions/node/v14.15.4/bin/node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '/home/sharetribe/web/staging.hotpatch.com';
          const current = fs.realpathSync(root + '/current');
          if (!current.startsWith(root + '/releases/')) throw new Error('Staging path check failed');
          const envPath = fs.realpathSync(current + '/.env');
          if (envPath !== root + '/shared/.env') throw new Error('Staging env path check failed');
          const dotenv = require(path.join(current, 'node_modules/dotenv'));
          const env = dotenv.parse(fs.readFileSync(envPath));
          if (env.REACT_APP_SHARETRIBE_SDK_CLIENT_ID !== 'a187af2a-0454-4bed-abb9-834129ccf241') throw new Error('Unexpected dev identity');
          console.log('Staging dev identity verified');
          for (const key of ['GOOGLE_CALENDAR_CLIENT_ID','GOOGLE_CALENDAR_CLIENT_SECRET','GOOGLE_CALENDAR_OWNER_EMAIL','GOOGLE_CALENDAR_OAUTH_REDIRECT_URI','GOOGLE_CALENDAR_CALENDAR_ID','GOOGLE_CALENDAR_REFRESH_TOKEN','SHARETRIBE_INTEGRATION_CLIENT_ID','SHARETRIBE_INTEGRATION_CLIENT_SECRET']) console.log(key + ': ' + (env[key] ? 'configured' : 'missing'));
          console.log('Expected Google owner: ' + (env.GOOGLE_CALENDAR_OWNER_EMAIL === 'hotpatch@hotpatch.com'));
          console.log('Expected OAuth callback: ' + (env.GOOGLE_CALENDAR_OAUTH_REDIRECT_URI === 'https://staging.hotpatch.com/api/integrations/google-calendar/callback'));
          console.log('OAuth enabled: ' + (env.GOOGLE_CALENDAR_OAUTH_ENABLED === 'true'));
          console.log('Sync enabled: ' + (env.GOOGLE_CALENDAR_SYNC_ENABLED === 'true'));
          for (const file of ['server/calendar/runtime.js','server/calendar/worker.js','server/api/calendar-oauth.js']) console.log(file + ': ' + fs.existsSync(path.join(current,file)));
          console.log('Read only check complete; no credentials, flags or services changed');
          NODE
