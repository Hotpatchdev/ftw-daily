name: Enable staging Calendar connection
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/calendar-staging-consent.yml]
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare the staging connection page
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          SCRIPT_B64=''
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "/home/sharetribe/.nvm/versions/node/v14.15.4/bin/node -e 'eval(Buffer.from(\"$SCRIPT_B64\",\"base64\").toString(\"utf8\"))'"
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'pm2 delete staging && NODE_ENV=production pm2 start /home/sharetribe/web/staging.hotpatch.com/current/server/index.js --cwd /home/sharetribe/web/staging.hotpatch.com/current --interpreter /home/sharetribe/.nvm/versions/node/v14.15.4/bin/node --name staging && pm2 save'
