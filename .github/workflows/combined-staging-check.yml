name: Combined staging verification
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/combined-staging-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read staging runtime errors
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'set -e; cd /home/sharetribe/web/staging.hotpatch.com/current; NODE_ENV=production /home/sharetribe/.nvm/versions/node/v14.15.4/bin/node -e \"const fs=require(\\\"fs\\\");const d=require(\\\"dotenv\\\");const p=fs.realpathSync(\\\".env\\\");if(!p.startsWith(\\\"/home/sharetribe/web/staging.hotpatch.com/\\\"))throw Error(\\\"Wrong environment\\\");const old=fs.readFileSync(p,\\\"utf8\\\");const env=d.parse(old);if(env.REACT_APP_SHARETRIBE_SDK_CLIENT_ID!==\\\"a187af2a-0454-4bed-abb9-834129ccf241\\\"||!String(env.REACT_APP_STRIPE_PUBLISHABLE_KEY).startsWith(\\\"pk_test_\\\"))throw Error(\\\"Dev/test identity check failed\\\");fs.copyFileSync(p,p+\\\".before-combined-20261027\\\",fs.constants.COPYFILE_EXCL);fs.chmodSync(p+\\\".before-combined-20261027\\\",0o600);const clean=old.split(/\\\\r?\\\\n/).filter(l=>!/^\\\\s*(COMBINED_BOOKINGS_ENABLED|COMBINED_BOOKING_STORE_DIR)\\\\s*=/.test(l)).join(\\\"\\\\n\\\");fs.writeFileSync(p+\\\".combined.tmp\\\",clean+\\\"\\\\nCOMBINED_BOOKINGS_ENABLED=false\\\\nCOMBINED_BOOKING_STORE_DIR=/home/sharetribe/web/staging.hotpatch.com/shared/combined-bookings\\\\n\\\",{mode:0o600});fs.renameSync(p+\\\".combined.tmp\\\",p);fs.mkdirSync(\\\"/home/sharetribe/web/staging.hotpatch.com/shared/combined-bookings\\\",{recursive:true,mode:0o700});console.log(\\\"Dev identity verified; combined checkout remains disabled until checks pass\\\");\"' | sed -E 's/(Bearer |token[=: ]+|secret[=: ]+)[^ ]+/\1[redacted]/Ig'
