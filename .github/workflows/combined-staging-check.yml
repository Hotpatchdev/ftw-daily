name: Combined staging verification
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/combined-staging-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read staging runtime errors
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'set -e; cd /home/sharetribe/web/staging.hotpatch.com/current; test "$(cat REVISION)" = 15dd5e9b89262ba93c4b259b4dd5c7488d0eff67; pm2 restart staging --update-env; pm2 save; sleep 3; curl --silent --fail http://127.0.0.1:3000/api/combined-booking-enabled'
