name: Combined staging verification
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/combined-staging-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read staging runtime errors
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/sharetribe/web/staging.hotpatch.com/current && NODE_ENV=production /home/sharetribe/.nvm/versions/node/v14.15.4/bin/node' <<'REMOTE_JS'
          const fs=require('fs'),cp=require('child_process');
          const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8'}));const app=apps.find(a=>a.name==='staging');
          if(!app)throw Error('Staging process missing');const file=app.pm2_env.pm_err_log_path;
          if(!file.startsWith('/home/sharetribe/.pm2/logs/'))throw Error('Unexpected log path');
          const lines=fs.readFileSync(file,'utf8').split('\n').filter(l=>/Combined booking request failed [0-9]+/.test(l)).slice(-5);
          lines.forEach(l=>console.log(l.match(/Combined booking request failed [0-9]+/)[0]));
          REMOTE_JS
