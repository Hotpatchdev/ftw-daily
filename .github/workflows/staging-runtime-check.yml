name: Diagnose staging runtime
on:
  push:
    branches: [design/search-discovery]
    paths: [.github/workflows/staging-runtime-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read staging runtime errors
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging.key ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging.key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'set -e; cd /home/sharetribe/web/staging.hotpatch.com/current; test $(cat REVISION) = c559c500159db785f92f1e84d0004b2b28a5a76c; cp /home/sharetribe/.pm2/dump.pm2 /home/sharetribe/.pm2/dump.pm2.before-minimum-20261027; chmod 600 /home/sharetribe/.pm2/dump.pm2.before-minimum-20261027; pm2 delete staging; NODE_ENV=production pm2 start /home/sharetribe/web/staging.hotpatch.com/current/server/index.js --cwd /home/sharetribe/web/staging.hotpatch.com/current --interpreter /home/sharetribe/.nvm/versions/node/v14.15.4/bin/node --name staging; pm2 save; sleep 5; pm2 describe staging | head -26; curl --silent --output /dev/null --write-out HTTP:%{http_code} http://127.0.0.1:3000/' | sed -E 's/(Bearer |token[=: ]+|secret[=: ]+)[^ ]+/\1[redacted]/Ig'
